name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment and Secrets
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            echo "Creating empty .env file..."
            touch .env
          fi

      - name: Prepare Debug Keystore
        run: |
          # Restore debug keystore from base64 if present, or generate a standard debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            echo "Setting executable permissions on existing gradlew..."
            chmod +x ./gradlew
          else
            echo "gradlew not found. Generating Gradle Wrapper 9.3.1 using installed Gradle..."
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          echo "Listing generated APK files:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
